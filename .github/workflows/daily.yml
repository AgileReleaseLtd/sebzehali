name: Fetch prices and publish

on:
  schedule:
    # 08:15, 11:15, 14:15 and 17:15 Turkey time (UTC+3). Bulletins appear during the morning
    # and some cities correct them later in the day.
    - cron: "15 5,8,11,14 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Fetch today's bulletins
        if: github.event_name != 'push'
        run: python -m sebzehali.fetch --backfill 3
      - name: Commit new data
        if: github.event_name != 'push'
        run: |
          git config user.name "sebzehali-bot"
          git config user.email "sebzehali-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: bulletins $(date -u +%F)" && git push)
      - name: Build site
        run: python -m sebzehali.build --out site --base-url https://www.sebzehali.com
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: github.event_name != 'push'
      - name: Notify IndexNow (Bing, Yandex)
        if: github.event_name != 'push'
        run: |
          python -m sebzehali.build --out site --base-url https://www.sebzehali.com
          python -m sebzehali.indexnow site/sitemap.xml
